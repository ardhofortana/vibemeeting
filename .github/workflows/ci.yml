name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  personal-terms:
    name: No personal content in shipped sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check app, VibeCore, project and script sources
        # The app ships to anyone, so one person's names and business details stay out of it.
        # One line may name the bundle ID from before the Djavaweb identity: the app reads
        # it once to copy settings and the API key (VibeMeeting/App/IdentityMigration.swift).
        run: |
          set +e
          hits=$(git grep -n -i -I -E 'ardho|ardhofortana|detheme|fiverr|pressable|elementor|jetengine' -- VibeMeeting Packages/VibeCore/Sources project.yml scripts Configs)
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "::error::git grep failed with status $status."
            exit "$status"
          fi
          hits=$(printf '%s\n' "$hits" | grep -v -E '^VibeMeeting/App/IdentityMigration\.swift:[0-9]+: *static let legacyBundleID = "com\.ardhofortana\.VibeMeeting"$' | grep -v '^$' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::Personal terms found in shipped sources (listed above)."
            exit 1
          fi
          echo "No personal terms found."

  catalogs:
    name: String catalogs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Catalogs are valid and the permission prompts match Info.plist
        run: python3 scripts/check-catalogs.py

  core:
    name: VibeCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - name: Start local SSE server for transport tests
        run: |
          apt-get update -qq && apt-get install -y -qq python3 > /dev/null
          python3 scripts/sse_test_server.py 18777 &
          sleep 1
      - name: Test
        env:
          VIBE_LOCAL_SSE_URL: http://127.0.0.1:18777
        run: swift test --package-path Packages/VibeCore

  app:
    name: App build (macOS 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          sw_vers
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test VibeCore on macOS
        run: swift test --package-path Packages/VibeCore
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project VibeMeeting.xcodeproj \
            -scheme VibeMeeting \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
