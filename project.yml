# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
name: VibeMeeting
options:
  bundleIdPrefix: com.ardhofortana
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    majorVersion: 2.0.0
  VibeCore:
    path: Packages/VibeCore
targets:
  VibeMeeting:
    type: application
    platform: macOS
    sources:
      - path: VibeMeeting
        excludes:
          - "Resources/**"
    configFiles:
      Debug: Configs/Signing.xcconfig
      Release: Configs/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ardhofortana.VibeMeeting
        PRODUCT_NAME: VibeMeeting
        INFOPLIST_FILE: VibeMeeting/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: VibeMeeting/Resources/VibeMeeting.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        # Set by scripts/release.sh; see CHANGELOG.md.
        MARKETING_VERSION: 0.6.0
        CURRENT_PROJECT_VERSION: 7
    preBuildScripts:
      - name: Check signing Team
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${DEVELOPMENT_TEAM}" ] && [ -z "${CI}" ]; then
            echo "warning: No signing Team. macOS ties System Audio Recording to the app's signature, so an ad-hoc build hears only silence after every rebuild. Pick your Team under Signing & Capabilities, then run scripts/save-signing-team.sh."
          fi
    dependencies:
      - package: KeyboardShortcuts
      - package: VibeCore
schemes:
  VibeMeeting:
    build:
      targets:
        VibeMeeting: all
    run:
      config: Debug
    archive:
      config: Release
