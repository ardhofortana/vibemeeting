# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
name: VibeMeeting
options:
  bundleIdPrefix: com.djavaweb
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    majorVersion: 2.0.0
  VibeCore:
    path: Packages/VibeCore
targets:
  VibeMeeting:
    type: application
    platform: macOS
    sources:
      - path: VibeMeeting
        # Resources/ holds Info.plist and the entitlements, which build settings name
        # directly. The string catalogs sit in VibeMeeting/ itself, so they're built in.
        excludes:
          - "Resources/**"
    configFiles:
      Debug: Configs/Signing.xcconfig
      Release: Configs/Signing.xcconfig
    settings:
      base:
        # Release identity. scripts/bundle-id.sh reads the bundle IDs from here.
        PRODUCT_BUNDLE_IDENTIFIER: com.djavaweb.vibemeeting
        PRODUCT_NAME: VibeMeeting
        # The name Finder and System Settings → Privacy & Security show.
        APP_DISPLAY_NAME: VibeMeeting
        # Folder in Application Support for meetings and diagnostics. Release keeps
        # "VibeMeeting", where every earlier version saved meetings.
        APP_DATA_FOLDER: VibeMeeting
        INFOPLIST_FILE: VibeMeeting/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: VibeMeeting/Resources/VibeMeeting.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        # User-facing text goes through VibeMeeting/Localizable.xcstrings and, for the
        # permission prompts, VibeMeeting/InfoPlist.xcstrings. English is the base
        # language (developmentLanguage above); see docs/COPY.md.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Set by scripts/release.sh; see DEVELOPMENT.md.
        MARKETING_VERSION: 0.6.0
        CURRENT_PROJECT_VERSION: 7
      configs:
        # A development build is a separate app, so it never shares settings, the
        # Keychain item, privacy permissions or meetings with a release install.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.djavaweb.vibemeeting.debug
          APP_DISPLAY_NAME: VibeMeeting Dev
          APP_DATA_FOLDER: VibeMeeting Dev
    preBuildScripts:
      - name: Check signing Team
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${DEVELOPMENT_TEAM}" ] && [ -z "${CI}" ]; then
            echo "warning: No signing Team. macOS ties System Audio Recording to the app's signature, so an ad-hoc build hears only silence after every rebuild. Pick your Team under Signing & Capabilities, then run scripts/save-signing-team.sh."
          fi
    dependencies:
      - package: KeyboardShortcuts
      - package: VibeCore
schemes:
  VibeMeeting:
    build:
      targets:
        VibeMeeting: all
    run:
      config: Debug
    archive:
      config: Release
